# Shell Styling
shell_integration no-cursor
cursor_shape underline
cursor_beam_thickness 0.75
cursor_underline_thickness 1
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Window Style
# wayland_titlebar_color background
hide_window_decorations yes

# Hyprland :)
linux_display_server wayland

background_opacity 0.75

# Fonts
font_family      Maple Mono NF
font_size        15

font_features    MapleMono-NF-Regular +cv01 +cv03 +cv05 +cv07 +cv09 +cv10 +cv61 +cv65 +cv66 +ss03 +zero +ss11 +ss10 +ss09 +ss08 +ss07 +ss06
font_features    MapleMono-NF-Bold +cv01 +cv03 +cv05 +cv07 +cv09 +cv10 +cv61 +cv65 +cv66 +ss03 +zero +ss11 +ss10 +ss09 +ss08 +ss07 +ss06
font_features    MapleMono-NF-Italic +cv01 +cv03 +cv05 +cv07 +cv09 +cv10 +cv61 +cv65 +cv66 +ss03 +zero +ss11 +ss10 +ss09 +ss08 +ss07 +ss06
adjust_line_height 200%

tab_bar_min_tabs            2
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# cursor_trail 1
cursor_trail 3
cursor_trail_decay 0.1 0.4

include rose-pine-kitty/dist/rose-pine-moon.conf